# Template for another repository; the active workflow is ../../.github/workflows/presentation.yml.
name: Publish INFORMS presentation
on:
  push:
    branches: [main]
    paths: ['presentation/**', '.github/workflows/presentation.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.38'
      - name: Render slides and reading view
        run: quarto render presentation
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: presentation/_site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
